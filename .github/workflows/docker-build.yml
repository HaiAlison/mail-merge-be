name: Build and Push Docker Image

# Kích hoạt workflow khi có code được push lên nhánh 'main' (hoặc 'master')
on:
  push:
    branches:
      - "release-*"
  # Hoặc bạn có thể kích hoạt khi tạo tag mới (ví dụ: v1.0.0)
  # tags:
  #   - 'v*'

# Định nghĩa các biến môi trường
env:
  # Tên registry của GitHub
  REGISTRY: ghcr.io
  # Tên image sẽ có dạng: ghcr.io/tài_khoản_github/tên_repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    # Cấp quyền cho action để push image lên GHCR
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Đăng nhập vào GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Mật khẩu này được GitHub cung cấp tự động trong quá trình chạy
          password: ${{ secrets.GITHUB_TOKEN }}

      # Trích xuất metadata (tags, labels) cho Docker
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Gắn tag tự động (ví dụ: tên nhánh, hoặc SHA của commit)
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      # Build và Push image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Đổi thành đường dẫn Dockerfile của bạn nếu nó không nằm ở thư mục gốc
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dùng cache để những lần build sau nhanh hơn
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gọi Webhook tới VPS sau khi push image thành công
      - name: Trigger Webhook for CD
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          curl -X POST \
            -H "X-Webhook-Token: ${{ secrets.WEBHOOK_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"sha\": \"$SHORT_SHA\"}" \
            ${{ secrets.WEBHOOK_DOMAIN }}/hooks/deploy-app
